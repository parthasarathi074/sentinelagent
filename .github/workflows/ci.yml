name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip build

      - name: Install package and developer dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check code with Ruff
        run: python -m ruff check src tests scripts

      - name: Run tests
        run: python -m pytest -q

      - name: Build source distribution and wheel
        run: python -m build

      - name: Verify built wheel installation
        shell: bash
        run: |
          python -m venv /tmp/sentinelagent-wheel-test
          /tmp/sentinelagent-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/sentinelagent-wheel-test/bin/python -m pip check